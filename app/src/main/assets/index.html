<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抛物线</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#c9d1d9;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;touch-action:none}

  body.mode-main{background:#0d1117}
  body.mode-floating{background:transparent}
  html.mode-floating{background:transparent}

  #panel{position:fixed;top:14px;left:14px;
    background:rgba(22,27,34,.92);border:1px solid #30363d;border-radius:10px;
    padding:10px 14px;font-size:12px;line-height:1.7;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    user-select:none;z-index:10}
  body.mode-main #panel{width:280px;max-width:92vw}
  body.mode-floating #panel{width:260px;max-width:92vw}

  #titleRow{display:flex;align-items:center;gap:8px}
  #titleRow h1{margin:0;font-size:13px;color:#58a6ff;letter-spacing:.5px}
  #bToggle{width:22px;height:22px;flex:0 0 auto;
    background:#21262d;border:1px solid #30363d;border-radius:5px;
    color:#c9d1d9;font-size:12px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
    font-family:inherit}
  #bToggle:hover{background:#30363d}

  #bHighArc{
    margin-left:auto;
    padding:3px 10px;
    background:#21262d;border:1px solid #30363d;border-radius:5px;
    color:#c9d1d9;font-size:11px;line-height:1.3;
    cursor:pointer;font-family:inherit;
    white-space:nowrap}
  #bHighArc:hover{background:#30363d}
  #bHighArc.on{background:#F0883E;border-color:#F0883E;color:#fff}
  #bHighArc.on:hover{background:#ffa657}

  #panel.collapsed{width:auto;padding:8px}
  #panel.collapsed #titleRow h1{display:none}
  #panel.collapsed #body{display:none}

  #body{margin-top:8px}

  .kRow{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .kRow > span:first-child{color:#8b949e;flex:0 0 auto;min-width:36px}
  .kCtrl{display:flex;align-items:center;gap:4px;flex:1 1 auto;justify-content:flex-end}
  .k-btn{width:24px;height:24px;padding:0;flex:0 0 auto;
    background:#21262d;border:1px solid #30363d;border-radius:5px;
    color:#c9d1d9;font-size:14px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit}
  .k-btn:hover{background:#30363d}
  .k-btn:active{background:#1f6feb}
  .k-val{flex:1 1 auto;min-width:0;text-align:right;
    padding:2px 6px;
    background:transparent;border:1px solid transparent;border-radius:5px;
    color:#7ee787;font-family:inherit;font-size:12px;
    cursor:pointer;outline:none}
  .k-val:hover{border-color:#30363d}
  .k-val.static{cursor:default}
  .k-val.static:hover{border-color:transparent}

  .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .btns button{flex:1;background:#21262d;color:#c9d1d9;border:1px solid #30363d;
    border-radius:6px;padding:6px 0;cursor:pointer;font-family:inherit;font-size:12px;
    min-width:0;white-space:nowrap}
  .btns button:hover{background:#30363d}
  .btns button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .btns button.primary:hover{background:#388bfd}
  .btns button.on{background:#F0883E;border-color:#F0883E;color:#fff}
  .btns button.on:hover{background:#ffa657}

  #rightCol{
    position:fixed;top:14px;left:308px;
    display:flex;flex-direction:column;gap:8px;
    z-index:10}

  #dpad{
    background:rgba(22,27,34,.92);
    border:1px solid #30363d;border-radius:10px;
    padding:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    user-select:none;
    display:none}
  .dpad-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    grid-template-rows:1fr 1fr 1fr;
    gap:6px;
    width:100%;height:100%}
  .dpad-btn{
    background:#21262d;border:1px solid #30363d;border-radius:50%;
    color:#c9d1d9;font-size:18px;line-height:1;cursor:pointer;
    font-family:inherit;padding:0;
    display:flex;align-items:center;justify-content:center;
    min-width:0;min-height:0}
  .dpad-btn:hover{background:#30363d}
  .dpad-btn:active{background:#1f6feb;color:#fff}
  #dpadUp{grid-column:2;grid-row:1}
  #dpadLeft{grid-column:1;grid-row:2}
  #dpadRight{grid-column:3;grid-row:2}
  #dpadDown{grid-column:2;grid-row:3}

  #sliderWrap{
    background:rgba(22,27,34,.92);
    border:1px solid #30363d;border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    padding:0 10px;
    display:none;
    align-items:center;
    gap:8px;
    height:40px;
    user-select:none}
  #sliderLabel{
    color:#7ee787;font-size:12px;font-family:inherit;
    flex:0 0 auto;min-width:34px;text-align:left}
  #sliderTrack{
    flex:1 1 auto;
    height:6px;background:#30363d;border-radius:3px;
    position:relative;cursor:pointer;touch-action:none}
  #sliderThumb{
    position:absolute;top:50%;transform:translateY(-50%);
    width:16px;height:16px;border-radius:50%;
    background:#7ee787;
    left:0;cursor:pointer;
    box-shadow:0 0 6px rgba(126,231,135,0.8)}

  #hint{position:fixed;top:20px;left:50%;transform:translateX(-50%);
    background:rgba(248,81,73,.92);color:#fff;
    padding:8px 18px;border-radius:8px;font-size:13px;
    box-shadow:0 4px 16px rgba(0,0,0,.5);
    z-index:50;display:none;white-space:nowrap;max-width:92vw;
    overflow:hidden;text-overflow:ellipsis}
  #hint.show{display:block}

  #numPad{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);
    width:250px;background:rgba(22,27,34,.97);
    border:1px solid #30363d;border-radius:12px;
    padding:10px;z-index:100;
    box-shadow:0 8px 30px rgba(0,0,0,.7);
    display:none}
  #numPad.show{display:block}
  .np-display{background:#0d1117;border:1px solid #30363d;border-radius:6px;
    padding:8px 10px;text-align:right;font-size:16px;color:#7ee787;
    margin-bottom:8px;min-height:34px;overflow:hidden;white-space:nowrap;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .np-grid button{
    background:#21262d;border:1px solid #30363d;border-radius:6px;
    color:#c9d1d9;font-size:16px;padding:10px 0;cursor:pointer;
    font-family:inherit}
  .np-grid button:hover{background:#30363d}
  .np-grid button:active{background:#1f6feb}
  .np-grid button.ok{background:#1f6feb;border-color:#1f6feb;color:#fff;grid-column:2 / span 2}
  .np-grid button.cancel{background:#21262d;color:#8b949e}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hint"></div>

<div id="panel">
  <div id="titleRow">
    <button id="bToggle" title="折叠 / 展开">■</button>
    <h1>抛物线参数</h1>
    <button id="bHighArc">高抛 开</button>
  </div>
  <div id="body">
    <div class="kRow">
      <span>K</span>
      <span class="kCtrl">
        <button class="k-btn" id="bKMinus">−</button>
        <span class="k-val" id="vK">0.00025</span>
        <button class="k-btn" id="bKPlus">+</button>
      </span>
    </div>
    <div class="kRow">
      <span>偏移</span>
      <span class="kCtrl">
        <button class="k-btn" id="bOMinus">−</button>
        <span class="k-val" id="vO">40</span>
        <button class="k-btn" id="bOPlus">+</button>
      </span>
    </div>
    <div class="btns">
      <button id="bReset" style="flex:1">恢复默认</button>
      <button id="bLine" style="flex:1">直线 开</button>
    </div>
    <div class="kRow" style="margin-top:8px">
      <span></span>
      <span class="kCtrl">
        <button class="k-btn" id="bOMinus2">−</button>
        <span class="k-val static" id="vO2">0</span>
        <button class="k-btn" id="bOPlus2">+</button>
      </span>
    </div>
    <div class="btns main-only">
      <button id="bFloating">启动悬浮窗</button>
    </div>
    <div class="btns">
      <button id="bLoad" class="primary">载入图片吸附</button>
    </div>
  </div>
</div>

<div id="rightCol">
  <div id="dpad">
    <div class="dpad-grid">
      <button class="dpad-btn" id="dpadUp" title="上">↑</button>
      <button class="dpad-btn" id="dpadLeft" title="左">←</button>
      <button class="dpad-btn" id="dpadRight" title="右">→</button>
      <button class="dpad-btn" id="dpadDown" title="下">↓</button>
    </div>
  </div>
  <div id="sliderWrap">
    <span id="sliderLabel">40%</span>
    <div id="sliderTrack">
      <div id="sliderThumb"></div>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

<div id="numPad">
  <div class="np-display" id="npDisplay">0</div>
  <div class="np-grid">
    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button data-k=".">.</button>
    <button data-k="0">0</button>
    <button data-k="back">⌫</button>
    <button data-k="cancel" class="cancel">取消</button>
    <button data-k="ok" class="ok">确定</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var isFloating = (new URLSearchParams(location.search).get('mode') === 'floating');
  var STORAGE_PREFIX = 'arcapp_';

  var CANVAS_W = 2000;
  var CANVAS_H = 1200;

  var K_UNIT = 100000;
  var K_DEFAULT = 25;
  var K_MIN = 1;

  var OFFSET_DEFAULT = 40;
  var OFFSET_MIN = 0;
  var OFFSET_MAX = 300;

  var OFFSET2_DEFAULT = 0;
  var OFFSET2_STEP = 2;

  var FORK_RATIO_DEFAULT = 0.40;
  var FORK_RATIO_MIN = 0.30;
  var FORK_RATIO_MAX = 0.50;

  var WHITE_THRESHOLD = 230;

  var ARROW_MIN_W = 8,  ARROW_MAX_W = 30;
  var ARROW_MIN_H = 10, ARROW_MAX_H = 35;

  var SEARCH_X0 = 0;
  var SEARCH_Y0 = Math.floor(CANVAS_H / 2);
  var SEARCH_X1 = Math.floor(CANVAS_W / 2);
  var SEARCH_Y1 = CANVAS_H;

  var kInt = K_DEFAULT;
  var offset = OFFSET_DEFAULT;
  var offset2 = OFFSET2_DEFAULT;
  var forkRatio = FORK_RATIO_DEFAULT;
  var showLine = false;
  var highArcMode = false;

  var startX = 600, startY = 500;
  var endX = 1400, endY = 700;

  var lastSnapCenter = null;
  var bgImage = null;

  var lastDetection = null;

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var scale = 1, offsetX = 0, offsetY = 0;

  var panel = document.getElementById('panel');
  var rightCol = document.getElementById('rightCol');
  var dpad = document.getElementById('dpad');
  var sliderWrap = document.getElementById('sliderWrap');
  var sliderTrack = document.getElementById('sliderTrack');
  var sliderThumb = document.getElementById('sliderThumb');
  var sliderLabel = document.getElementById('sliderLabel');
  var bToggle = document.getElementById('bToggle');
  var bHighArc = document.getElementById('bHighArc');
  var vK = document.getElementById('vK');
  var bKPlus = document.getElementById('bKPlus');
  var bKMinus = document.getElementById('bKMinus');
  var vO = document.getElementById('vO');
  var bOPlus = document.getElementById('bOPlus');
  var bOMinus = document.getElementById('bOMinus');
  var vO2 = document.getElementById('vO2');
  var bOPlus2 = document.getElementById('bOPlus2');
  var bOMinus2 = document.getElementById('bOMinus2');
  var bLine = document.getElementById('bLine');
  var numPad = document.getElementById('numPad');
  var npDisplay = document.getElementById('npDisplay');
  var hintEl = document.getElementById('hint');
  var fileInput = document.getElementById('file');

  var locked = false;

  if (isFloating) {
    document.body.classList.add('mode-floating');
    document.documentElement.classList.add('mode-floating');
  } else {
    document.body.classList.add('mode-main');
  }

  function loadStored() {
    try {
      var k = parseInt(localStorage.getItem(STORAGE_PREFIX + 'kInt'), 10);
      if (!isNaN(k) && k >= K_MIN) kInt = k;

      var o = parseInt(localStorage.getItem(STORAGE_PREFIX + 'offset'), 10);
      if (!isNaN(o)) offset = Math.max(OFFSET_MIN, Math.min(OFFSET_MAX, o));

      var o2 = parseInt(localStorage.getItem(STORAGE_PREFIX + 'offset2'), 10);
      if (!isNaN(o2)) offset2 = o2;

      var fr = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'forkRatio'));
      if (!isNaN(fr)) {
        forkRatio = Math.max(FORK_RATIO_MIN, Math.min(FORK_RATIO_MAX, fr));
      }

      var sl = localStorage.getItem(STORAGE_PREFIX + 'showLine');
      showLine = (sl === '1');

      var ha = localStorage.getItem(STORAGE_PREFIX + 'highArcMode');
      highArcMode = (ha === '1');

      var sx = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'startX'));
      var sy = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'startY'));
      var ex = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'endX'));
      var ey = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'endY'));
      if (!isNaN(sx)) startX = sx;
      if (!isNaN(sy)) startY = sy;
      if (!isNaN(ex)) endX = ex;
      if (!isNaN(ey)) endY = ey;
    } catch (e) {}
  }

  function saveStored() {
    try {
      localStorage.setItem(STORAGE_PREFIX + 'kInt', String(kInt));
      localStorage.setItem(STORAGE_PREFIX + 'offset', String(offset));
      localStorage.setItem(STORAGE_PREFIX + 'offset2', String(offset2));
      localStorage.setItem(STORAGE_PREFIX + 'forkRatio', String(forkRatio));
      localStorage.setItem(STORAGE_PREFIX + 'showLine', showLine ? '1' : '0');
      localStorage.setItem(STORAGE_PREFIX + 'highArcMode', highArcMode ? '1' : '0');
      localStorage.setItem(STORAGE_PREFIX + 'startX', String(startX));
      localStorage.setItem(STORAGE_PREFIX + 'startY', String(startY));
      localStorage.setItem(STORAGE_PREFIX + 'endX', String(endX));
      localStorage.setItem(STORAGE_PREFIX + 'endY', String(endY));
    } catch (e) {}
  }

  function recalcMapping() {
    scale = Math.min(W / CANVAS_W, H / CANVAS_H);
    offsetX = (W - CANVAS_W * scale) / 2;
    offsetY = (H - CANVAS_H * scale) / 2;
  }
  function toScreenX(lx) { return offsetX + lx * scale; }
  function toScreenY(ly) { return offsetY + ly * scale; }
  function toLogicX(sx)  { return (sx - offsetX) / scale; }
  function toLogicY(sy)  { return (sy - offsetY) / scale; }

  function getK() { return kInt / K_UNIT; }
  function setK(newInt) {
    if (newInt < K_MIN) newInt = K_MIN;
    if (newInt === kInt) return;
    kInt = newInt;
    updateKDisplay();
    saveStored();
  }
  function updateKDisplay() {
    vK.textContent = (kInt / K_UNIT).toFixed(5);
  }

  function setOffset(newO) {
    newO = Math.round(newO);
    if (newO < OFFSET_MIN) newO = OFFSET_MIN;
    if (newO > OFFSET_MAX) newO = OFFSET_MAX;
    if (newO === offset) return;
    offset = newO;
    updateOffsetDisplay();
    saveStored();
    if (lastSnapCenter) applySnapFromCenter();
  }
  function updateOffsetDisplay() {
    vO.textContent = String(offset);
  }

  function setOffset2(newO) {
    newO = Math.round(newO);
    if (newO === offset2) return;
    offset2 = newO;
    updateOffset2Display();
    saveStored();
  }
  function updateOffset2Display() {
    vO2.textContent = String(offset2);
  }

  function setForkRatio(v) {
    v = Math.max(FORK_RATIO_MIN, Math.min(FORK_RATIO_MAX, v));
    v = Math.round(v * 100) / 100;
    if (v === forkRatio) return;
    forkRatio = v;
    updateSliderUI();
    saveStored();
  }

  function updateSliderUI() {
    if (!sliderTrack || !sliderThumb) return;
    var range = FORK_RATIO_MAX - FORK_RATIO_MIN;
    var t = range > 0 ? (forkRatio - FORK_RATIO_MIN) / range : 0;
    t = Math.max(0, Math.min(1, t));

    var trackW = sliderTrack.clientWidth;
    var thumbW = sliderThumb.offsetWidth || 16;
    var maxLeft = Math.max(0, trackW - thumbW);
    sliderThumb.style.left = (t * maxLeft) + 'px';

    sliderLabel.textContent = Math.round(forkRatio * 100) + '%';
  }

  function updateLineBtn() {
    if (!bLine) return;
    if (showLine) {
      bLine.textContent = '直线 关';
      bLine.classList.add('on');
    } else {
      bLine.textContent = '直线 开';
      bLine.classList.remove('on');
    }
  }

  function updateHighArcBtn() {
    if (!bHighArc) return;
    if (highArcMode) {
      bHighArc.textContent = '高抛 关';
      bHighArc.classList.add('on');
    } else {
      bHighArc.textContent = '高抛 开';
      bHighArc.classList.remove('on');
    }
  }

  function calcParabola(x0, y0, x1, y1, K, highArc) {
    var d = x1 - x0;
    var h = y1 - y0;
    var A = K * d * d;
    if (Math.abs(A) < 1e-15) return null;
    var disc = d * d - 4 * A * (A - h);
    if (disc < 0) return null;

    var sq = Math.sqrt(disc);
    var t1 = (d - sq) / (2 * A);
    var t2 = (d + sq) / (2 * A);

    var t;
    if (highArc) {
      t = Math.abs(t1) > Math.abs(t2) ? t1 : t2;
    } else {
      t = Math.abs(t1) < Math.abs(t2) ? t1 : t2;
    }

    var a = K * (1 + t * t);
    var b = -t - 2 * a * x0;
    var c = y0 + t * x0 + a * x0 * x0;
    return { a: a, b: b, c: c };
  }

  function drawBackgroundImage() {
    if (isFloating) return;
    if (!bgImage) return;

    var iw = bgImage.naturalWidth || bgImage.width;
    var ih = bgImage.naturalHeight || bgImage.height;
    if (!iw || !ih) return;

    var areaX = offsetX;
    var areaY = offsetY;
    var areaW = CANVAS_W * scale;
    var areaH = CANVAS_H * scale;

    var s = Math.min(areaW / iw, areaH / ih);
    var dw = iw * s;
    var dh = ih * s;
    var dx = areaX + (areaW - dw) / 2;
    var dy = areaY + (areaH - dh) / 2;

    ctx.drawImage(bgImage, dx, dy, dw, dh);
  }

  function drawDetectionBoxes() {
    if (isFloating) return;
    if (!lastDetection || !lastDetection.groups) return;
    var groups = lastDetection.groups;
    var sel = lastDetection.selected;

    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      if (g.w < 3 || g.h < 3) continue;

      var bx = toScreenX(g.x0);
      var by = toScreenY(g.y0);
      var bw = (g.x1 - g.x0 + 1) * scale;
      var bh = (g.y1 - g.y0 + 1) * scale;

      if (g === sel) {
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
      } else {
        ctx.strokeStyle = 'rgba(88,166,255,0.55)';
        ctx.lineWidth = 1;
      }
      ctx.strokeRect(bx, by, bw, bh);
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    drawBackgroundImage();

    // ===== 直线（橙色）：画在最下层 =====
    if (showLine) {
      ctx.save();
      ctx.strokeStyle = '#F0883E';
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(toScreenX(startX), toScreenY(startY));
      ctx.lineTo(toScreenX(endX), toScreenY(endY));
      ctx.stroke();
      ctx.restore();
    }

    var K = getK();
    var p = calcParabola(startX, startY, endX, endY, K, highArcMode);

    if (p) {
      // ===== 第一条线（绿色）=====
      var xs = Math.min(startX, endX);
      var xe = Math.max(startX, endX);
      var span = xe - xs;
      var N = Math.max(64, Math.min(2000, Math.ceil(span)));

      ctx.beginPath();
      for (var i = 0; i <= N; i++) {
        var lx = xs + span * (i / N);
        var ly = p.a * lx * lx + p.b * lx + p.c;
        var sx = toScreenX(lx);
        var sy = toScreenY(ly);
        if (i) ctx.lineTo(sx, sy); else ctx.moveTo(sx, sy);
      }
      ctx.save();
      ctx.shadowColor = 'rgba(126,231,135,0.9)';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#7ee787';
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();

      // ===== 第二条线（浅绿）=====
      var dirSign = (endX >= startX) ? 1 : -1;
      var xFork = startX + (endX - startX) * forkRatio;
      var tTotal = Math.abs(endX - xFork);

      ctx.beginPath();
      var started = false;
      var drawEndX = dirSign > 0 ? CANVAS_W : 0;

      for (var lx2 = startX;
           dirSign > 0 ? lx2 <= drawEndX : lx2 >= drawEndX;
           lx2 += dirSign) {

        var y1 = p.a * lx2 * lx2 + p.b * lx2 + p.c;
        var y2;

        var inFirstHalf = (dirSign > 0) ? (lx2 <= xFork) : (lx2 >= xFork);

        if (inFirstHalf || tTotal < 1e-9) {
          y2 = y1;
        } else {
          var tDist = Math.abs(lx2 - xFork);
          var t = tDist / tTotal;
          y2 = y1 - offset2 * t * t;
        }

        if (y2 < 0 || y2 > CANVAS_H) break;

        var sx2 = toScreenX(lx2);
        var sy2 = toScreenY(y2);
        if (!started) { ctx.moveTo(sx2, sy2); started = true; }
        else ctx.lineTo(sx2, sy2);
      }

      ctx.save();
      ctx.shadowColor = 'rgba(185,246,202,0.9)';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#b9f6ca';
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();

      if (!hintEl.dataset.persist) hintEl.classList.remove('show');
    } else {
      hintEl.textContent = 'K 值过大，请调小数值';
      hintEl.classList.add('show');
    }

    if (!locked) {
      drawCrosshair(startX, startY, '#FF0000');
      drawCrosshair(endX, endY, '#0000FF');
    }

    drawDot(startX, startY, '#FF0000');
    drawDot(endX, endY, '#0000FF');

    drawDetectionBoxes();
  }

  function drawCrosshair(lx, ly, color) {
    var sx = toScreenX(lx);
    var sy = toScreenY(ly);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx, 0); ctx.lineTo(sx, H);
    ctx.moveTo(0, sy); ctx.lineTo(W, sy);
    ctx.stroke();
  }

  function drawDot(lx, ly, color) {
    var sx = toScreenX(lx);
    var sy = toScreenY(ly);
    ctx.beginPath();
    ctx.arc(sx, sy, 2, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    recalcMapping();
  }
  window.addEventListener('resize', resize);

  function syncRightCol() {
    if (panel.classList.contains('collapsed')) {
      rightCol.style.display = 'none';
      return;
    }
    rightCol.style.display = 'flex';

    var rect = panel.getBoundingClientRect();
    var totalH = rect.height;

    var sliderH = 40;
    var gap = 8;

    var dpadH = Math.max(80, totalH - sliderH - gap);
    var colW = dpadH;

    rightCol.style.top = rect.top + 'px';
    rightCol.style.left = (rect.right + 14) + 'px';
    rightCol.style.width = colW + 'px';
    rightCol.style.height = totalH + 'px';

    dpad.style.display = 'block';
    dpad.style.width = colW + 'px';
    dpad.style.height = dpadH + 'px';
    dpad.style.padding = '8px';
    dpad.style.boxSizing = 'border-box';

    sliderWrap.style.display = 'flex';
    sliderWrap.style.width = colW + 'px';
    sliderWrap.style.height = sliderH + 'px';
    sliderWrap.style.boxSizing = 'border-box';

    setTimeout(updateSliderUI, 0);
  }
  window.addEventListener('resize', syncRightCol);

  var drag = null;
  var TOUCH_THRESHOLD = 30;

  cv.addEventListener('pointerdown', function (e) {
    var mx = e.clientX, my = e.clientY;
    var targets = [
      { type: 'sx', dist: Math.abs(mx - toScreenX(startX)) },
      { type: 'sy', dist: Math.abs(my - toScreenY(startY)) },
      { type: 'ex', dist: Math.abs(mx - toScreenX(endX)) },
      { type: 'ey', dist: Math.abs(my - toScreenY(endY)) }
    ];
    targets.sort(function (p, q) { return p.dist - q.dist; });
    var t = targets[0];
    if (t.dist <= TOUCH_THRESHOLD) {
      drag = t.type;
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    }
  });

  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var mx = e.clientX, my = e.clientY;
    if (drag === 'sx') startX = toLogicX(mx);
    else if (drag === 'sy') startY = toLogicY(my);
    else if (drag === 'ex') endX = toLogicX(mx);
    else if (drag === 'ey') endY = toLogicY(my);
    saveStored();
  });

  cv.addEventListener('pointerup', function (e) {
    drag = null;
    try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener('pointercancel', function () { drag = null; });

  bToggle.addEventListener('click', function () {
    var collapsed = panel.classList.toggle('collapsed');
    bToggle.textContent = collapsed ? '▼' : '■';
    syncRightCol();
  });

  window.__setPanelCollapsed = function (c) {
    locked = !!c;
    if (c) {
      panel.classList.add('collapsed');
      bToggle.textContent = '▼';
    } else {
      panel.classList.remove('collapsed');
      bToggle.textContent = '■';
    }
    syncRightCol();
  };

  bHighArc.addEventListener('click', function () {
    highArcMode = !highArcMode;
    updateHighArcBtn();
    saveStored();
  });

  var holdTimer = null;
  var HOLD_INTERVAL = 100;

  function startHold(fn) {
    fn();
    if (holdTimer) clearInterval(holdTimer);
    holdTimer = setInterval(fn, HOLD_INTERVAL);
  }
  function stopHold() {
    if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
  }
  function bindHold(btn, fn) {
    btn.addEventListener('pointerdown', function (e) { e.preventDefault(); startHold(fn); });
    btn.addEventListener('pointerup', stopHold);
    btn.addEventListener('pointerleave', stopHold);
    btn.addEventListener('pointercancel', stopHold);
  }

  bindHold(bKPlus, function () { setK(kInt + 1); });
  bindHold(bKMinus, function () { setK(kInt - 1); });
  bindHold(bOPlus, function () { setOffset(offset + 1); });
  bindHold(bOMinus, function () { setOffset(offset - 1); });
  bindHold(bOPlus2, function () { setOffset2(offset2 + OFFSET2_STEP); });
  bindHold(bOMinus2, function () { setOffset2(offset2 - OFFSET2_STEP); });

  function nudgeStart(dx, dy) {
    startX += dx;
    startY += dy;
    saveStored();
  }
  bindHold(document.getElementById('dpadUp'),    function () { nudgeStart(0, -1); });
  bindHold(document.getElementById('dpadDown'),  function () { nudgeStart(0, 1); });
  bindHold(document.getElementById('dpadLeft'),  function () { nudgeStart(-1, 0); });
  bindHold(document.getElementById('dpadRight'), function () { nudgeStart(1, 0); });

  var sliderDragging = false;

  function setForkFromClientX(clientX) {
    var rect = sliderTrack.getBoundingClientRect();
    if (rect.width <= 0) return;
    var thumbW = sliderThumb.offsetWidth || 16;
    var maxLeft = Math.max(1, rect.width - thumbW);
    var x = clientX - rect.left - thumbW / 2;
    var t = x / maxLeft;
    t = Math.max(0, Math.min(1, t));
    var v = FORK_RATIO_MIN + t * (FORK_RATIO_MAX - FORK_RATIO_MIN);
    setForkRatio(v);
  }

  sliderTrack.addEventListener('pointerdown', function (e) {
    sliderDragging = true;
    try { sliderTrack.setPointerCapture(e.pointerId); } catch (_) {}
    setForkFromClientX(e.clientX);
    e.preventDefault();
  });
  sliderTrack.addEventListener('pointermove', function (e) {
    if (!sliderDragging) return;
    setForkFromClientX(e.clientX);
  });
  sliderTrack.addEventListener('pointerup', function (e) {
    sliderDragging = false;
    try { sliderTrack.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  sliderTrack.addEventListener('pointercancel', function () {
    sliderDragging = false;
  });

  var npBuffer = '';
  var activeTarget = null;

  function showNumPad(target) {
    activeTarget = target;
    if (target === 'k') {
      npBuffer = (kInt / K_UNIT).toFixed(5);
    } else if (target === 'offset') {
      npBuffer = String(offset);
    }
    npDisplay.textContent = npBuffer;
    numPad.classList.add('show');
  }
  function hideNumPad() {
    numPad.classList.remove('show');
    activeTarget = null;
  }
  function npAppend(ch) {
    if (ch === '.' && npBuffer.indexOf('.') >= 0) return;
    if (npBuffer.length >= 20) return;
    npBuffer += ch;
    npDisplay.textContent = npBuffer;
  }
  function npBackspace() {
    npBuffer = npBuffer.slice(0, -1);
    npDisplay.textContent = npBuffer || '0';
  }
  function npConfirm() {
    if (activeTarget === 'k') {
      var v = parseFloat(npBuffer);
      if (!isNaN(v) && v > 0) setK(Math.round(v * K_UNIT));
    } else if (activeTarget === 'offset') {
      var o = parseFloat(npBuffer);
      if (!isNaN(o)) setOffset(o);
    }
    hideNumPad();
  }

  vK.addEventListener('click', function () { showNumPad('k'); });
  vO.addEventListener('click', function () { showNumPad('offset'); });

  numPad.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var k = btn.dataset.k;
    if (k === 'back') npBackspace();
    else if (k === 'cancel') hideNumPad();
    else if (k === 'ok') npConfirm();
    else if (k === '.') npAppend('.');
    else if (/^\d$/.test(k)) npAppend(k);
  });

  function showHint(text, persist) {
    hintEl.textContent = text;
    hintEl.classList.add('show');
    if (persist) {
      hintEl.dataset.persist = '1';
      clearTimeout(showHint._t);
      showHint._t = setTimeout(function () {
        hintEl.classList.remove('show');
        delete hintEl.dataset.persist;
      }, 4000);
    } else {
      delete hintEl.dataset.persist;
    }
  }

  function findArrowCenter(img) {
    var off = document.createElement('canvas');
    off.width = CANVAS_W;
    off.height = CANVAS_H;
    var octx = off.getContext('2d');
    if (!octx) return { ok: false, reason: 'draw-fail', groups: [] };

    try {
      octx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
    } catch (e) {
      return { ok: false, reason: 'draw-fail', groups: [] };
    }

    var sx0 = SEARCH_X0;
    var sy0 = SEARCH_Y0;
    var sx1 = SEARCH_X1;
    var sy1 = SEARCH_Y1;
    var w = sx1 - sx0;
    var h = sy1 - sy0;

    var data;
    try {
      data = octx.getImageData(sx0, sy0, w, h).data;
    } catch (e) {
      return { ok: false, reason: 'read-fail', msg: (e && (e.name || e.message)) || 'unknown', groups: [] };
    }

    function isWhite(idx) {
      var o = idx * 4;
      return data[o + 3] >= 200 &&
             data[o]     >= WHITE_THRESHOLD &&
             data[o + 1] >= WHITE_THRESHOLD &&
             data[o + 2] >= WHITE_THRESHOLD;
    }

    var visited = new Uint8Array(w * h);
    var groups = [];

    for (var j = 0; j < h; j++) {
      for (var i = 0; i < w; i++) {
        var p = j * w + i;
        if (visited[p]) continue;
        visited[p] = 1;
        if (!isWhite(p)) continue;

        var stack = [p];
        var minX = i, maxX = i, minY = j, maxY = j;
        var sumX = 0, sumY = 0, count = 0;

        while (stack.length) {
          var q = stack.pop();
          var qi = q % w;
          var qj = (q - qi) / w;
          sumX += qi;
          sumY += qj;
          count++;
          if (qi < minX) minX = qi;
          if (qi > maxX) maxX = qi;
          if (qj < minY) minY = qj;
          if (qj > maxY) maxY = qj;

          if (qi > 0)     { var n1 = q - 1; if (!visited[n1] && isWhite(n1)) { visited[n1] = 1; stack.push(n1); } }
          if (qi < w - 1) { var n2 = q + 1; if (!visited[n2] && isWhite(n2)) { visited[n2] = 1; stack.push(n2); } }
          if (qj > 0)     { var n3 = q - w; if (!visited[n3] && isWhite(n3)) { visited[n3] = 1; stack.push(n3); } }
          if (qj < h - 1) { var n4 = q + w; if (!visited[n4] && isWhite(n4)) { visited[n4] = 1; stack.push(n4); } }
        }

        var gx0 = sx0 + minX;
        var gy0 = sy0 + minY;
        var gx1 = sx0 + maxX;
        var gy1 = sy0 + maxY;
        var gw = maxX - minX + 1;
        var gh = maxY - minY + 1;

        var passed = (gw >= ARROW_MIN_W && gw <= ARROW_MAX_W &&
                      gh >= ARROW_MIN_H && gh <= ARROW_MAX_H);

        groups.push({
          x0: gx0, y0: gy0, x1: gx1, y1: gy1,
          w: gw, h: gh,
          cx: sx0 + (sumX / count),
          cy: sy0 + (sumY / count),
          count: count,
          passed: passed
        });
      }
    }

    var candidates = [];
    for (var k2 = 0; k2 < groups.length; k2++) {
      if (groups[k2].passed) candidates.push(groups[k2]);
    }

    if (candidates.length === 0) {
      return { ok: false, reason: 'no-arrow', groups: groups, selected: null };
    }

    var best = null, bestDist = Infinity;
    for (var k3 = 0; k3 < candidates.length; k3++) {
      var c = candidates[k3];
      var dd = Math.sqrt((c.cx - startX) * (c.cx - startX) + (c.cy - startY) * (c.cy - startY));
      if (dd < bestDist) {
        bestDist = dd;
        best = c;
      }
    }

    return { ok: true, center: { x: best.cx, y: best.cy }, groups: groups, selected: best };
  }

  function applySnapFromCenter() {
    if (!lastSnapCenter) return;
    startX = lastSnapCenter.x;
    startY = lastSnapCenter.y + offset;
    saveStored();
  }

  function processImage(img) {
    if (!isFloating) {
      bgImage = img;
    }

    var res = findArrowCenter(img);
    lastDetection = res;

    if (res.ok) {
      lastSnapCenter = res.center;
      applySnapFromCenter();
      showHint('已吸附 · 白团 ' + res.groups.length + ' 个', true);
      return;
    }

    if (res.reason === 'draw-fail') {
      showHint('图片绘制失败', true);
    } else if (res.reason === 'read-fail') {
      showHint('图片像素读取失败（' + res.msg + '）', true);
    } else if (res.reason === 'no-arrow') {
      showHint('左下角白团 ' + res.groups.length + ' 个，无符合尺寸的', true);
    } else {
      showHint('未知失败', true);
    }
  }

  window.__onImageLoaded = function (dataUri) {
    var img = new Image();
    img.onload = function () { processImage(img); };
    img.onerror = function () { showHint('图片载入失败', true); };
    img.src = dataUri;
  };

  window.__onImageError = function (msg) {
    showHint(msg || '读取失败', true);
  };

  document.getElementById('bLoad').addEventListener('click', function () {
    if (isFloating) {
      if (window.AndroidBridge && window.AndroidBridge.requestLoadImage) {
        window.AndroidBridge.requestLoadImage();
      } else {
        showHint('请在安卓 App 内使用此功能', true);
      }
    } else {
      fileInput.click();
    }
  });

  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    var img = new Image();

    img.onload = function () {
      URL.revokeObjectURL(url);
      processImage(img);
    };

    img.onerror = function () {
      URL.revokeObjectURL(url);
      showHint('图片载入失败', true);
    };

    img.src = url;
    fileInput.value = '';
  });

  document.getElementById('bReset').addEventListener('click', function () {
    kInt = K_DEFAULT;
    offset = OFFSET_DEFAULT;
    offset2 = OFFSET2_DEFAULT;
    forkRatio = FORK_RATIO_DEFAULT;
    updateKDisplay();
    updateOffsetDisplay();
    updateOffset2Display();
    updateSliderUI();
    saveStored();
  });

  bLine.addEventListener('click', function () {
    showLine = !showLine;
    updateLineBtn();
    saveStored();
  });

  var bFloating = document.getElementById('bFloating');
  if (bFloating) {
    bFloating.addEventListener('click', function () {
      if (window.AndroidBridge && window.AndroidBridge.startFloating) {
        window.AndroidBridge.startFloating();
      } else {
        alert('请在安卓 App 内使用悬浮窗功能');
      }
    });
  }

  var rafId = null;

  function tick() {
    render();
    rafId = requestAnimationFrame(tick);
  }

  function pauseRender() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  function resumeRender() {
    if (rafId === null) {
      rafId = requestAnimationFrame(tick);
    }
  }

  window.__pauseRender = pauseRender;
  window.__resumeRender = resumeRender;

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      pauseRender();
    } else {
      loadStored();
      updateKDisplay();
      updateOffsetDisplay();
      updateOffset2Display();
      updateLineBtn();
      updateHighArcBtn();
      syncRightCol();
      resumeRender();
    }
  });

  loadStored();
  resize();
  updateKDisplay();
  updateOffsetDisplay();
  updateOffset2Display();
  updateLineBtn();
  updateHighArcBtn();
  resumeRender();

  setTimeout(function () {
    syncRightCol();
    updateSliderUI();
  }, 0);

})();
</script>
</body>
</html>
