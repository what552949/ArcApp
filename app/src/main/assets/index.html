<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抛物线</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#c9d1d9;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;touch-action:none}

  body.mode-main{background:#0d1117}
  body.mode-floating{background:transparent}
  html.mode-floating{background:transparent}

  #panel{position:fixed;top:14px;left:14px;
    background:rgba(22,27,34,.92);border:1px solid #30363d;border-radius:10px;
    padding:10px 14px;font-size:12px;line-height:1.7;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    user-select:none;z-index:10}
  body.mode-main #panel{width:260px;max-width:92vw}
  body.mode-floating #panel{width:240px;max-width:92vw}

  #titleRow{display:flex;align-items:center;gap:8px}
  #titleRow h1{margin:0;font-size:13px;color:#58a6ff;letter-spacing:.5px}
  #bToggle{width:22px;height:22px;flex:0 0 auto;
    background:#21262d;border:1px solid #30363d;border-radius:5px;
    color:#c9d1d9;font-size:12px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
    font-family:inherit}
  #bToggle:hover{background:#30363d}

  #panel.collapsed{width:auto;padding:8px}
  #panel.collapsed #titleRow h1{display:none}
  #panel.collapsed #body{display:none}

  #body{margin-top:8px}

  .kRow{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .kRow > span:first-child{color:#8b949e;flex:0 0 auto}
  .kCtrl{display:flex;align-items:center;gap:4px;flex:1 1 auto;justify-content:flex-end}
  .k-btn{width:24px;height:24px;padding:0;flex:0 0 auto;
    background:#21262d;border:1px solid #30363d;border-radius:5px;
    color:#c9d1d9;font-size:14px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit}
  .k-btn:hover{background:#30363d}
  .k-btn:active{background:#1f6feb}
  .k-val{flex:1 1 auto;min-width:0;text-align:right;
    padding:2px 6px;
    background:transparent;border:1px solid transparent;border-radius:5px;
    color:#7ee787;font-family:inherit;font-size:12px;
    cursor:pointer;outline:none}
  .k-val:hover{border-color:#30363d}

  .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .btns button{flex:1;background:#21262d;color:#c9d1d9;border:1px solid #30363d;
    border-radius:6px;padding:6px 0;cursor:pointer;font-family:inherit;font-size:12px;
    min-width:0;white-space:nowrap}
  .btns button:hover{background:#30363d}
  .btns button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .btns button.primary:hover{background:#388bfd}

  #hint{position:fixed;top:20px;left:50%;transform:translateX(-50%);
    background:rgba(248,81,73,.92);color:#fff;
    padding:8px 18px;border-radius:8px;font-size:13px;
    box-shadow:0 4px 16px rgba(0,0,0,.5);
    z-index:50;display:none;white-space:nowrap}
  #hint.show{display:block}

  #numPad{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);
    width:250px;background:rgba(22,27,34,.97);
    border:1px solid #30363d;border-radius:12px;
    padding:10px;z-index:100;
    box-shadow:0 8px 30px rgba(0,0,0,.7);
    display:none}
  #numPad.show{display:block}
  .np-display{background:#0d1117;border:1px solid #30363d;border-radius:6px;
    padding:8px 10px;text-align:right;font-size:16px;color:#7ee787;
    margin-bottom:8px;min-height:34px;overflow:hidden;white-space:nowrap;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .np-grid button{
    background:#21262d;border:1px solid #30363d;border-radius:6px;
    color:#c9d1d9;font-size:16px;padding:10px 0;cursor:pointer;
    font-family:inherit}
  .np-grid button:hover{background:#30363d}
  .np-grid button:active{background:#1f6feb}
  .np-grid button.ok{background:#1f6feb;border-color:#1f6feb;color:#fff;grid-column:2 / span 2}
  .np-grid button.cancel{background:#21262d;color:#8b949e}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hint"></div>

<div id="panel">
  <div id="titleRow">
    <button id="bToggle" title="折叠 / 展开">■</button>
    <h1>抛物线参数</h1>
  </div>
  <div id="body">
    <div class="kRow">
      <span>K</span>
      <span class="kCtrl">
        <button class="k-btn" id="bKMinus">−</button>
        <span class="k-val" id="vK">0.00028</span>
        <button class="k-btn" id="bKPlus">+</button>
      </span>
    </div>
    <div class="btns">
      <button id="bReset">恢复默认</button>
    </div>
    <div class="btns main-only">
      <button id="bFloating">启动悬浮窗</button>
    </div>
  </div>
</div>

<div id="numPad">
  <div class="np-display" id="npDisplay">0</div>
  <div class="np-grid">
    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button data-k=".">.</button>
    <button data-k="0">0</button>
    <button data-k="back">⌫</button>
    <button data-k="cancel" class="cancel">取消</button>
    <button data-k="ok" class="ok">确定</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var isFloating = (new URLSearchParams(location.search).get('mode') === 'floating');
  var STORAGE_PREFIX = isFloating ? 'arcapp_floating_' : 'arcapp_main_';

  var CANVAS_W = 2000;
  var CANVAS_H = 1200;

  var K_UNIT = 100000;
  var K_DEFAULT = 28;   // 0.00028
  var K_MIN = 1;        // 0.00001

  var kInt = K_DEFAULT;

  // 起点、终点（逻辑画布坐标）
  var startX = 600, startY = 500;
  var endX = 1400, endY = 700;

  // 屏幕
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var scale = 1, offsetX = 0, offsetY = 0;

  // UI
  var panel = document.getElementById('panel');
  var bToggle = document.getElementById('bToggle');
  var vK = document.getElementById('vK');
  var bKPlus = document.getElementById('bKPlus');
  var bKMinus = document.getElementById('bKMinus');
  var numPad = document.getElementById('numPad');
  var npDisplay = document.getElementById('npDisplay');
  var hintEl = document.getElementById('hint');

  var locked = false;

  if (isFloating) {
    document.body.classList.add('mode-floating');
    document.documentElement.classList.add('mode-floating');
  } else {
    document.body.classList.add('mode-main');
  }

  // ============ 本地存储 ============
  function loadStored() {
    try {
      var k = parseInt(localStorage.getItem(STORAGE_PREFIX + 'kInt'), 10);
      if (!isNaN(k) && k >= K_MIN) kInt = k;

      var sx = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'startX'));
      var sy = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'startY'));
      var ex = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'endX'));
      var ey = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'endY'));
      if (!isNaN(sx)) startX = sx;
      if (!isNaN(sy)) startY = sy;
      if (!isNaN(ex)) endX = ex;
      if (!isNaN(ey)) endY = ey;
    } catch (e) {}
  }

  function saveStored() {
    try {
      localStorage.setItem(STORAGE_PREFIX + 'kInt', String(kInt));
      localStorage.setItem(STORAGE_PREFIX + 'startX', String(startX));
      localStorage.setItem(STORAGE_PREFIX + 'startY', String(startY));
      localStorage.setItem(STORAGE_PREFIX + 'endX', String(endX));
      localStorage.setItem(STORAGE_PREFIX + 'endY', String(endY));
    } catch (e) {}
  }

  // ============ 坐标映射 ============
  function recalcMapping() {
    scale = Math.min(W / CANVAS_W, H / CANVAS_H);
    offsetX = (W - CANVAS_W * scale) / 2;
    offsetY = (H - CANVAS_H * scale) / 2;
  }
  function toScreenX(lx) { return offsetX + lx * scale; }
  function toScreenY(ly) { return offsetY + ly * scale; }
  function toLogicX(sx)  { return (sx - offsetX) / scale; }
  function toLogicY(sy)  { return (sy - offsetY) / scale; }

  // ============ K ============
  function getK() { return kInt / K_UNIT; }
  function setK(newInt) {
    if (newInt < K_MIN) newInt = K_MIN;
    if (newInt === kInt) return;
    kInt = newInt;
    updateKDisplay();
    saveStored();
  }
  function updateKDisplay() {
    vK.textContent = (kInt / K_UNIT).toFixed(5);
  }

  // ============ 抛物线 ============
  function calcParabola(x0, y0, x1, y1, K) {
    var d = x1 - x0;
    var h = y1 - y0;
    var A = K * d * d;
    if (Math.abs(A) < 1e-15) return null;
    var disc = d * d - 4 * A * (A - h);
    if (disc < 0) return null;

    var sq = Math.sqrt(disc);
    var t1 = (d - sq) / (2 * A);
    var t2 = (d + sq) / (2 * A);
    var t = Math.abs(t1) < Math.abs(t2) ? t1 : t2;

    var a = K * (1 + t * t);
    var b = -t - 2 * a * x0;
    var c = y0 + t * x0 + a * x0 * x0;
    return { a: a, b: b, c: c };
  }

  // ============ 绘制 ============
  function render() {
    ctx.clearRect(0, 0, W, H);

    var K = getK();
    var p = calcParabola(startX, startY, endX, endY, K);

    if (p) {
      var xs = Math.min(startX, endX);
      var xe = Math.max(startX, endX);
      var span = xe - xs;
      var N = Math.max(64, Math.min(2000, Math.ceil(span)));

      ctx.beginPath();
      for (var i = 0; i <= N; i++) {
        var lx = xs + span * (i / N);
        var ly = p.a * lx * lx + p.b * lx + p.c;
        var sx = toScreenX(lx);
        var sy = toScreenY(ly);
        if (i) ctx.lineTo(sx, sy); else ctx.moveTo(sx, sy);
      }
      ctx.save();
      ctx.shadowColor = 'rgba(126,231,135,0.9)';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#7ee787';
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();
      hintEl.classList.remove('show');
    } else {
      hintEl.textContent = 'K 值过大，请调小数值';
      hintEl.classList.add('show');
    }

    // 十字参考线（锁定时隐藏）
    if (!locked) {
      drawCrosshair(startX, startY, '#FF0000');
      drawCrosshair(endX, endY, '#0000FF');
    }

    // 交点小圆点
    drawDot(startX, startY, '#FF0000');
    drawDot(endX, endY, '#0000FF');
  }

  function drawCrosshair(lx, ly, color) {
    var sx = toScreenX(lx);
    var sy = toScreenY(ly);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx, 0); ctx.lineTo(sx, H);
    ctx.moveTo(0, sy); ctx.lineTo(W, sy);
    ctx.stroke();
  }

  function drawDot(lx, ly, color) {
    var sx = toScreenX(lx);
    var sy = toScreenY(ly);
    ctx.beginPath();
    ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  // ============ 尺寸 ============
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    recalcMapping();
  }
  window.addEventListener('resize', resize);

  // ============ 拖动十字线（触摸区 30px） ============
  var drag = null;
  var TOUCH_THRESHOLD = 30;

  cv.addEventListener('pointerdown', function (e) {
    var mx = e.clientX, my = e.clientY;
    var targets = [
      { type: 'sx', dist: Math.abs(mx - toScreenX(startX)) },
      { type: 'sy', dist: Math.abs(my - toScreenY(startY)) },
      { type: 'ex', dist: Math.abs(mx - toScreenX(endX)) },
      { type: 'ey', dist: Math.abs(my - toScreenY(endY)) }
    ];
    targets.sort(function (p, q) { return p.dist - q.dist; });
    var t = targets[0];
    if (t.dist <= TOUCH_THRESHOLD) {
      drag = t.type;
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    }
  });

  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var mx = e.clientX, my = e.clientY;
    if (drag === 'sx') startX = toLogicX(mx);
    else if (drag === 'sy') startY = toLogicY(my);
    else if (drag === 'ex') endX = toLogicX(mx);
    else if (drag === 'ey') endY = toLogicY(my);
    saveStored();
  });

  cv.addEventListener('pointerup', function (e) {
    drag = null;
    try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener('pointercancel', function () { drag = null; });

  // ============ 面板折叠 ============
  bToggle.addEventListener('click', function () {
    var collapsed = panel.classList.toggle('collapsed');
    bToggle.textContent = collapsed ? '▼' : '■';
  });

  window.__setPanelCollapsed = function (c) {
    locked = !!c;
    if (c) {
      panel.classList.add('collapsed');
      bToggle.textContent = '▼';
    } else {
      panel.classList.remove('collapsed');
      bToggle.textContent = '■';
    }
  };

  // ============ K 加减号 + 长按 ============
  var holdTimer = null;
  var HOLD_INTERVAL = 100;

  function startHold(delta) {
    setK(kInt + delta);
    if (holdTimer) clearInterval(holdTimer);
    holdTimer = setInterval(function () { setK(kInt + delta); }, HOLD_INTERVAL);
  }
  function stopHold() {
    if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
  }
  function bindHold(btn, delta) {
    btn.addEventListener('pointerdown', function (e) { e.preventDefault(); startHold(delta); });
    btn.addEventListener('pointerup', stopHold);
    btn.addEventListener('pointerleave', stopHold);
    btn.addEventListener('pointercancel', stopHold);
  }
  bindHold(bKPlus, 1);
  bindHold(bKMinus, -1);

  // ============ 数字键盘 ============
  var npBuffer = '';
  function showNumPad() {
    npBuffer = (kInt / K_UNIT).toFixed(5);
    npDisplay.textContent = npBuffer;
    numPad.classList.add('show');
  }
  function hideNumPad() { numPad.classList.remove('show'); }
  function npAppend(ch) {
    if (ch === '.' && npBuffer.indexOf('.') >= 0) return;
    if (npBuffer.length >= 20) return;
    npBuffer += ch;
    npDisplay.textContent = npBuffer;
  }
  function npBackspace() {
    npBuffer = npBuffer.slice(0, -1);
    npDisplay.textContent = npBuffer || '0';
  }
  function npConfirm() {
    var v = parseFloat(npBuffer);
    if (!isNaN(v) && v > 0) {
      setK(Math.round(v * K_UNIT));
    }
    hideNumPad();
  }
  vK.addEventListener('click', showNumPad);
  numPad.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var k = btn.dataset.k;
    if (k === 'back') npBackspace();
    else if (k === 'cancel') hideNumPad();
    else if (k === 'ok') npConfirm();
    else if (k === '.') npAppend('.');
    else if (/^\d$/.test(k)) npAppend(k);
  });

  // ============ 恢复默认 ============
  document.getElementById('bReset').addEventListener('click', function () {
    kInt = K_DEFAULT;
    updateKDisplay();
    saveStored();
  });

  // ============ 启动悬浮窗 ============
  var bFloating = document.getElementById('bFloating');
  if (bFloating) {
    bFloating.addEventListener('click', function () {
      if (window.AndroidBridge && window.AndroidBridge.startFloating) {
        window.AndroidBridge.startFloating();
      } else {
        alert('请在安卓 App 内使用悬浮窗功能');
      }
    });
  }

  // ============ 启动 ============
  loadStored();
  resize();
  updateKDisplay();

  function tick() {
    render();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
